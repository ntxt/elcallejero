# Netlify deploys the viewer only. The Python pipeline is not run here: the
# Málaga bundles it produces are committed under web/public/data, so a deploy is
# a plain JavaScript build with no Python, no poppler and no 57 MB download.
# Rebuild the data locally with `make all`, commit the bundles, and push.
#
# Deliberately no `base` setting. With a base directory set, Netlify resolves
# netlify.toml relative to *that* directory, so this file at the repository root
# is only partly read -- the build ran, but every [[headers]] block below was
# silently ignored. Changing directory inside the command instead keeps this file
# the single, unambiguous source of configuration.

[build]
  # Tolerant of the working directory. With no base directory Netlify runs this
  # at the repository root and the `cd` applies; if a base directory is set in
  # the UI -- which overrides this file -- the command already starts inside
  # web/, there is no web/web to enter, and it proceeds regardless. A bare
  # `cd web` fails outright in that second case and the deploy never happens.
  command = "[ -d web ] && cd web; npm ci && npm run build"
  publish = "web/dist"

[build.environment]
  NODE_VERSION = "20"

# Vite has already bundled and minified; letting the host post-process it again
# only risks changing output that was verified locally.
[build.processing]
  skip_processing = true

# Vite fingerprints everything under /assets, so those may be cached forever.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The city bundles keep stable names and change when the pipeline is re-run, so
# they are cached but always revalidated.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=600, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# Deliberately no SPA catch-all: the viewer routes in the URL fragment, so every
# real path is a real file. A catch-all would turn a missing city bundle into a
# silent page of HTML served as JSON instead of an honest 404.
